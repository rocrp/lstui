name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-macos-arm64:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Sign binary
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bin="target/aarch64-apple-darwin/release/lstui"
          IDENTITY=$(
            security find-identity -v -p codesigning \
              | grep "Developer ID Application" \
              | grep "(${APPLE_TEAM_ID})" \
              | head -1 \
              | sed 's/.*"\\(.*\\)"/\\1/'
          )

          if [ -z "${IDENTITY:-}" ]; then
            echo "No Developer ID Application identity for team: ${APPLE_TEAM_ID}" >&2
            security find-identity -v -p codesigning || true
            exit 1
          fi

          echo "Signing with: $IDENTITY"
          codesign --force --options runtime --sign "$IDENTITY" "$bin"
          codesign --verify --verbose "$bin"

      - name: Notarize binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          zip -j lstui-notarize.zip target/aarch64-apple-darwin/release/lstui

          xcrun notarytool submit lstui-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          rm lstui-notarize.zip

      - name: Package
        run: |
          set -euo pipefail
          bin="lstui"
          target="aarch64-apple-darwin"
          version="${GITHUB_REF_NAME}"
          out="${bin}-${version}-macos-arm64"
          mkdir -p dist
          cp "target/${target}/release/${bin}" "dist/${bin}"
          (cd dist && tar -czf "../${out}.tar.gz" "${bin}")
          rm -f "dist/${bin}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lstui-*.tar.gz

  update-homebrew:
    needs: release-macos-arm64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          repo="${GITHUB_REPOSITORY}"

          bin="lstui"
          asset="${bin}-${tag}-macos-arm64.tar.gz"
          url="${GITHUB_SERVER_URL}/${repo}/releases/download/${tag}/${asset}"

          for i in $(seq 1 30); do
            if curl -fsI "$url" >/dev/null; then
              break
            fi
            echo "Waiting for release asset... (${i}/30)"
            sleep 5
          done
          curl -fsI "$url" >/dev/null

          sha256=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/rocrp/homebrew-tap.git"
          cd homebrew-tap

          cat > Formula/lstui.rb << EOF
          class Lstui < Formula
            desc "Lobsters TUI (stories + nested comments)"
            homepage "https://github.com/${repo}"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${url}"
                sha256 "${sha256}"
              end
            end

            def install
              bin.install "${bin}"
            end

            test do
              assert_match "lstui", shell_output("#{bin}/lstui --help")
            end
          end
          EOF

          sed -i 's/^          //' Formula/lstui.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lstui.rb
          git commit -m "Update lstui to ${version}"
          git push
